<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 425 210" width="100%" height="210" fill="none">
  <defs>
    <linearGradient id="bg-01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <radialGradient id="glow-01" cx="95%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Container -->
  <rect width="425" height="210" rx="12" fill="url(#bg-01)" />
  <rect width="425" height="210" rx="12" fill="url(#glow-01)" />
  <rect x="0.5" y="0.5" width="424" height="209" rx="11.5" stroke="#1e293b" stroke-width="1" />

  <!-- Top row: Index & Category -->
  <g transform="translate(26, 32)">
    <text class="mono" font-size="11" font-weight="600" fill="#f43f5e" letter-spacing="0.08em">01</text>
    <text class="mono" font-size="10.5" fill="#64748b" x="28" letter-spacing="0.06em">/ CINEMA LOGGING</text>
  </g>

  <!-- Graphic Accent (top right) -->
  <g transform="translate(325, 20)">
    
<rect x="15" y="5" width="55" height="38" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
<circle cx="27" cy="18" r="4" fill="#a1a1aa" />
<circle cx="43" cy="18" r="4" fill="#a1a1aa" />
<circle cx="59" cy="18" r="4" fill="#a1a1aa" />
<line x1="15" y1="28" x2="70" y2="28" stroke="#3f3f46" stroke-width="1" />
<rect x="20" y="32" width="10" height="6" fill="#f43f5e" rx="1" />
<rect x="36" y="32" width="10" height="6" fill="#f43f5e" rx="1" />
<rect x="52" y="32" width="10" height="6" fill="#f43f5e" rx="1" />

  </g>

  <!-- Title & Description -->
  <g transform="translate(26, 78)">
    <text class="sans" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="-0.02em">afterframe</text>
    <text y="26" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8" width="370">
      <tspan x="0" dy="0">Movie logging tool & personal cinema tracker.</tspan>
      <tspan x="0" dy="18">Curated diary for films without the noise.</tspan>
    </text>
  </g>

  <!-- Stack tags at bottom -->
  <g transform="translate(26, 172)">
    <g transform="translate(0, 0)">
      <rect width="70" height="22" rx="5" fill="#131926" stroke="#1e293b" stroke-width="0.75" />
      <text x="35" y="14" class="mono" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">JavaScript</text>
    </g><g transform="translate(78, 0)">
      <rect width="70" height="22" rx="5" fill="#131926" stroke="#1e293b" stroke-width="0.75" />
      <text x="35" y="14" class="mono" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">React</text>
    </g><g transform="translate(156, 0)">
      <rect width="70" height="22" rx="5" fill="#131926" stroke="#1e293b" stroke-width="0.75" />
      <text x="35" y="14" class="mono" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">Postgres</text>
    </g><g transform="translate(234, 0)">
      <rect width="70" height="22" rx="5" fill="#131926" stroke="#1e293b" stroke-width="0.75" />
      <text x="35" y="14" class="mono" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">Express</text>
    </g>
  </g>
</svg>