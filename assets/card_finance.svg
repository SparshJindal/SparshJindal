<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 425 210" width="100%" height="210" fill="none">
  <defs>
    <linearGradient id="bg-02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <radialGradient id="glow-02" cx="95%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Container -->
  <rect width="425" height="210" rx="12" fill="url(#bg-02)" />
  <rect width="425" height="210" rx="12" fill="url(#glow-02)" />
  <rect x="0.5" y="0.5" width="424" height="209" rx="11.5" stroke="#1e293b" stroke-width="1" />

  <!-- Top row: Index & Category -->
  <g transform="translate(26, 32)">
    <text class="mono" font-size="11" font-weight="600" fill="#10b981" letter-spacing="0.08em">02</text>
    <text class="mono" font-size="10.5" fill="#64748b" x="28" letter-spacing="0.06em">/ MARKET INTEL</text>
  </g>

  <!-- Graphic Accent (top right) -->
  <g transform="translate(325, 20)">
    
<path d="M 5 35 Q 25 32 40 18 T 75 8" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
<path d="M 5 35 Q 25 32 40 18 T 75 8 L 75 42 L 5 42 Z" fill="#10b981" fill-opacity="0.1" />
<circle cx="75" cy="8" r="3" fill="#34d399" />

  </g>

  <!-- Title & Description -->
  <g transform="translate(26, 78)">
    <text class="sans" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="-0.02em">Finance-Tool</text>
    <text y="26" class="sans" font-size="12.5" font-weight="400" fill="#94a3b8" width="370">
      <tspan x="0" dy="0">Automated news & sentiment intelligence engine</tspan>
      <tspan x="0" dy="18">tailored directly to investment portfolios.</tspan>
    </text>
  </g>

  <!-- Stack tags at bottom -->
  <g transform="translate(26, 172)">
    <g transform="translate(0, 0)">
      <rect width="70" height="22" rx="5" fill="#131926" stroke="#1e293b" stroke-width="0.75" />
      <text x="35" y="14" class="mono" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">TypeScript</text>
    </g><g transform="translate(78, 0)">
      <rect width="70" height="22" rx="5" fill="#131926" stroke="#1e293b" stroke-width="0.75" />
      <text x="35" y="14" class="mono" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">APIs</text>
    </g><g transform="translate(156, 0)">
      <rect width="70" height="22" rx="5" fill="#131926" stroke="#1e293b" stroke-width="0.75" />
      <text x="35" y="14" class="mono" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">Node.js</text>
    </g><g transform="translate(234, 0)">
      <rect width="70" height="22" rx="5" fill="#131926" stroke="#1e293b" stroke-width="0.75" />
      <text x="35" y="14" class="mono" font-size="10" font-weight="500" fill="#cbd5e1" text-anchor="middle">Analysis</text>
    </g>
