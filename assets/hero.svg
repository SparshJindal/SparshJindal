<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" height="210" fill="none">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0d121c" />
      <stop offset="100%" stop-color="#070a0e" />
    </linearGradient>
    <radialGradient id="hero-glow" cx="90%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#080b11" stop-opacity="0" />
    </radialGradient>
    <pattern id="hero-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Container -->
  <rect width="880" height="210" rx="14" fill="url(#hero-bg)" />
  <rect width="880" height="210" rx="14" fill="url(#hero-glow)" />
  <rect width="880" height="210" rx="14" fill="url(#hero-grid)" />
  <rect x="0.5" y="0.5" width="879" height="209" rx="13.5" stroke="#334155" stroke-opacity="0.45" stroke-width="1" />

  <!-- Top bar info -->
  <g transform="translate(40, 36)">
    <circle cx="5" cy="5" r="4" fill="#10b981" />
    <circle cx="5" cy="5" r="7" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <text x="22" y="9" class="mono" font-size="11" fill="#94a3b8" letter-spacing="0.08em">SYSTEMS &#8226; FULL-STACK &#8226; FINTECH</text>

    <!-- Right-aligned breadcrumb -->
    <text x="795" y="9" class="mono" font-size="11" fill="#475569" text-anchor="end">sparshjindal / portfolio</text>
  </g>

  <!-- Main Identity -->
  <g transform="translate(40, 102)">
    <text class="sans" font-size="36" font-weight="700" fill="#f8fafc" letter-spacing="-0.03em">Sparsh Jindal</text>
    <text y="32" class="sans" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="-0.01em">Building software across web architectures, financial intelligence, and systems.</text>
  </g>

  <!-- Divider -->
  <line x1="40" y1="160" x2="840" y2="160" stroke="#1e293b" stroke-width="1" />

  <!-- Sub-footer coordinates -->
  <g transform="translate(40, 186)">
    <text class="mono" font-size="11" fill="#475569">LOCATION</text>
    <text class="mono" font-size="11" font-weight="500" fill="#cbd5e1" x="72">India</text>

    <text class="mono" font-size="11" fill="#475569" x="180">FOCUS</text>
    <text class="mono" font-size="11" font-weight="500" fill="#cbd5e1" x="235">Full-Stack Engineering &amp; High-Impact Tools</text>

    <text class="mono" font-size="11" fill="#475569" x="620">STATUS</text>
    <text class="mono" font-size="11" font-weight="500" fill="#38bdf8" x="680">Open to Collaborate</text>
  </g>
</svg>