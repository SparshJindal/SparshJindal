<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 425 210" width="100%" height="210" fill="none">
  <defs>
    <linearGradient id="bg-03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <radialGradient id="glow-03" cx="95%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Container -->
  <rect width="425" height="210" rx="12" fill="url(#bg-03)" />
  <rect width="425" height="210" rx="12" fill="url(#glow-03)" />
  <rect x="0.5" y="0.5" width="424" height="209" rx="11.5" stroke="#1e293b" stroke-width="1" />

  <!-- Top row: Index & Category -->
  <g transform="translate(26, 32)">
    <text class="mono" font-size="11" font-weight="600" fill="#f59e0b" letter-spacing="0.08em">03</text>
    <text class="mono" font-size="10.5" fill="#64748b" x="28" letter-spacing="0.06em">/ PROBABILITY ENGINE</text>
  </g>

  <!-- Graphic Accent (top right) -->
  <g transform="translate(325, 20)">
    
<rect x="25" y="5" width="28" height="38" rx="3" fill="#18181b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6" />
<text x="32" y="20" font-size="12" fill="#f59e0b" font-weight="bold" font-family="sans-serif">&#9824;</text>
<text x="39" y="34" font-size="11" fill="#fbbf24" font-weight="bold" font-family="sans-serif">A</text>
<rect x="42" y="10" width="28" height="38" rx="3" fill="#27272a" stroke="#ef4444" stroke-width="1" stroke-opacity="0.6" />
<text x="49" y="25" font-size="12" fill="#ef4444" font-weight="bold" font-family="sans-serif">&#9830;</text>
<text x="56" y="39" font-size="11" fill="#f87171" font-weight="bold" font-family="sans-serif">K</text>

  </g>

  <!-- Title & Description -->
