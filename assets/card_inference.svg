<line x1="20" y1="12" x2="48" y2="22" stroke="#6b21a8" stroke-width="1" opacity="0.6" />
<line x1="20" y1="32" x2="48" y2="22" stroke="#6b21a8" stroke-width="1" opacity="0.6" />
